<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>You Are My Universe 🌌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000000;
            font-family: 'Georgia', serif;
            touch-action: none;
        }
        canvas { display: block; }
        #ui {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #judul {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 28px;
            text-shadow: 0 0 25px #ffffff, 0 0 40px #88ccff;
            animation: glow 2s ease-in-out infinite alternate;
        }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            font-family: Arial;
            text-shadow: 0 0 10px #000;
            opacity: 0.8;
            transition: opacity 0.5s;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
            z-index: 200;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #ffffff, 0 0 30px #88ccff; }
            to { text-shadow: 0 0 30px #ffffff, 0 0 50px #88ccff; }
        }
    </style>
    
    <!-- WAJIB ADA BIAR JALAN DI HP -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Loading Universe... 🌌</div>
    <div id="ui">
        <div id="judul">You Are My Universe 🌌</div>
        <div id="info">Sentuh untuk musik | Pinch 2 jari untuk zoom | Geser untuk putar</div>
    </div>
    
    <audio id="bgm" loop>
        <source src="lagu_kalian.mp3" type="audio/mpeg">
    </audio>

        import * as THREE from 'three';
