<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mimul, My Universe 🌌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        #c { width: 100vw; height: 100vh; display: block; }
     .tap-info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: Arial; font-size: 14px; text-shadow: 0 0 10px #ff71ce;
            animation: blink 1.5s infinite; z-index: 10;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="tap-info">Sentuh layar & geser buat muterin universe kita ✨</div>
    <audio id="musik" src="./lagu_kalian.mp3" loop></audio>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        camera.position.z = 8;

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const posArray = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        const textureLoader = new THREE.TextureLoader();
        const mainTexture = textureLoader.load('./foto_kalian.jpg');
        const mainSphere = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 64, 64),
            new THREE.MeshBasicMaterial({ map: mainTexture })
        );
        scene.add(mainSphere);

        const photoTextures = [];
        for (let i = 1; i <= 8; i++) {
            photoTextures.push(textureLoader.load(`./foto${i}.jpg`));
        }

        const ring1 = new THREE.Group();
        const ring2 = new THREE.Group();
        scene.add(ring1, ring2);

        photoTextures.forEach((texture, i) => {
            const photo = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true })
            );
            const angle = (i / 4) * Math.PI * 2;
            const radius = 3;
            if (i < 4) {
                photo.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                ring1.add(photo);
            } else {
                photo.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                photo.rotation.y = Math.PI;
                ring2.add(photo);
            }
        });
        
        ring2.rotation.x = Math.PI / 2;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.body.addEventListener('click', () => {
            const musik = document.getElementById('musik');
            if (musik.paused) musik.play();
        }, { once: true });

        function animate() {
            requestAnimationFrame(animate);
            starField.rotation.y += 0.0002;
            mainSphere.rotation.y += 0.002;
            ring1.rotation.y += 0.005;
            ring2.rotation.y -= 0.005;
            ring1.children.forEach(p => p.lookAt(camera.position));
            ring2.children.forEach(p => p.lookAt(camera.position));
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
