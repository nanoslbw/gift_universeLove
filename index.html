<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>You Are My Universe 🌌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #ui {
            position: fixed; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; color: white;
            font-family: Georgia, serif; text-align: center;
        }
        #judul {
            position: absolute; top: 30px; width: 100%; font-size: 28px;
            text-shadow: 0 0 25px #fff, 0 0 40px #88ccff;
            animation: glow 2s ease-in-out infinite alternate;
        }
        #info {
            position: absolute; bottom: 30px; width: 100%; font-size: 14px;
            font-family: Arial; opacity: 0.8;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #fff, 0 0 30px #88ccff; }
            to { text-shadow: 0 0 30px #fff, 0 0 50px #88ccff; }
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        <div id="judul">You Are My Universe 🌌</div>
        <div id="info">Sentuh untuk musik | Pinch 2 jari untuk zoom | Geser untuk putar</div>
    </div>

    <audio id="bgm" loop>
        <source src="lagu_kalian.mp3" type="audio/mpeg">
    </audio>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMappingExposure = 2.0;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.minDistance = 2.5;
        controls.maxDistance = 40;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.2;
        camera.position.set(0, 2, 12);

        // CAHAYA
        scene.add(new THREE.AmbientLight(0x404040, 2));
        scene.add(new THREE.DirectionalLight(0xffffff, 2));

        // GALAKSI
        const galaxyGeometry = new THREE.SphereGeometry(800, 32, 32);
        const galaxyMaterial = new THREE.MeshBasicMaterial({
            color: 0x0a0a2a,
            side: THREE.BackSide
        });
        const galaxySphere = new THREE.Mesh(galaxyGeometry, galaxyMaterial);
        scene.add(galaxySphere);

        // BINTANG
        const starsGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(5000 * 3);
        for(let i = 0; i < 5000 * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 600;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.3, color: 0xffffff }));
        scene.add(stars);

        // BULAN
        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(1.8, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xaaaaaa, emissive: 0x6677aa, emissiveIntensity: 1.5 })
        );
        scene.add(moon);
        moon.add(new THREE.PointLight(0xaaaaff, 6, 50));

        // FOTO LU
        const textureLoader = new THREE.TextureLoader();
        const images = [
            'Screenshot_20260413-222119.jpg',
            'Screenshot_20260415-112014.jpg',
            'Screenshot_20260416-045337.jpg',
            'Screenshot_20260416-052453.jpg',
            'Screenshot_20260416-052457.jpg',
            'Screenshot_20260418-075359.jpg',
            'Screenshot_20260418-075421.jpg',
            'Screenshot_20260418-075429.jpg'
        ];

        const photoGroup = new THREE.Group();
        scene.add(photoGroup);

        images.forEach((img, i) => {
            const material = new THREE.MeshStandardMaterial({
                color: 0x444488,
                side: THREE.DoubleSide,
                emissive: 0x222244,
                emissiveIntensity: 0.5
            });

            textureLoader.load(img, function(texture) {
                material.map = texture;
                material.color.set(0xffffff);
                material.needsUpdate = true;
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
            const angle = (i / images.length) * Math.PI * 2;
            plane.position.x = Math.cos(angle) * 5;
            plane.position.z = Math.sin(angle) * 5;
            plane.position.y = Math.sin(i * 0.8) * 1.5;
            photoGroup.add(plane);
        });

        // MUSIK
        const bgm = document.getElementById('bgm');
        document.body.addEventListener('pointerdown', () => {
            if (bgm.paused) bgm.play().catch(e => {});
        });

        // ANIMASI
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = Date.now() * 0.0001;

            galaxySphere.rotation.y = elapsed;
            moon.rotation.y = elapsed *
