<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>You Are My Universe 🌙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000000;
            font-family: 'Georgia', serif;
            touch-action: none;
        }
        canvas { display: block; }
        #ui {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #judul {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 28px;
            text-shadow: 0 0 25px #ffffff, 0 0 40px #88ccff;
            animation: glow 2s ease-in-out infinite alternate;
        }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            font-family: Arial;
            text-shadow: 0 0 10px #000;
            opacity: 0.8;
            transition: opacity 0.5s;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #ffffff, 0 0 30px #88ccff; }
            to { text-shadow: 0 0 30px #ffffff, 0 0 50px #88ccff; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <div id="judul">You Are My Universe 🌙</div>
        <div id="info">Sentuh untuk musik | Pinch 2 jari untuk zoom | Geser untuk putar</div>
    </div>
    
    <audio id="bgm" loop>
        <source src="lagu_kalian.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // SETUP DASAR
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00025); // Efek kabut galaksi
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.8; // SUPER TERANG
        document.body.appendChild(renderer.domElement);

        // KONTROL - ZOOM LANCAR
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.5;
        controls.minDistance = 2.5; // Bisa deket banget
        controls.maxDistance = 30; // Bisa jauh banget
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        camera.position.set(0, 2, 10);

        // CAHAYA CINEMATIC
        scene.add(new THREE.AmbientLight(0x404040, 2));
        const hemiLight = new THREE.HemisphereLight(0x4477ff, 0x002244, 1);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // BINTANG LAYER 1 - BINTANG JAUH KECIL
        const starsGeometry1 = new THREE.BufferGeometry();
        const starsCount1 = 10000;
        const posArray1 = new Float32Array(starsCount1 * 3);
        for(let i = 0; i < starsCount1 * 3; i++) {
            posArray1[i] = (Math.random() - 0.5) * 1500;
        }
        starsGeometry1.setAttribute('position', new THREE.BufferAttribute(posArray1, 3));
