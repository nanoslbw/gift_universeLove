<!DOCTYPE html>
<html>
<head>
  <title>Hadiah Alam Semesta Cinta</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #loading { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-family: Arial; font-size: 20px;
    }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Memuat Galaksi Cinta...</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const loadingDiv = document.getElementById('loading');
    
    // Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.z = 8;
    
    // Bintang-bintang
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 5000;
    const posArray = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 100;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starsMaterial = new THREE.PointsMaterial({size: 0.05, color: 0xffffff});
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);
    
    // Foto Utama Tengah
    const textureLoader = new THREE.TextureLoader();
    const mainTexture = textureLoader.load('./foto_kalian.jpg');
    const mainSphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 64, 64),
      new THREE.MeshBasicMaterial({ map: mainTexture })
    );
    scene.add(mainSphere);
    
    // 8 FOTO LU YANG MUTEER
    const photoFiles = [
      'Screenshot_20260418-075359.jpg',
      'Screenshot_20260418-075421.jpg',
      'Screenshot_20260418-075429.jpg',
      'Screenshot_20260416-052457.jpg',
      'Screenshot_20260416-052453.jpg',
      'Screenshot_20260416-045337.jpg',
      'Screenshot_20260415-112014.jpg',
      'Screenshot_20260413-222119.jpg'
    ];
    const photoTextures = photoFiles.map(file => textureLoader.load(`./${file}`));
    
    const ring1 = new THREE.Group();
    const ring2 = new THREE.Group();
    scene.add(ring1, ring2);
    
    photoTextures.forEach((texture, i) => {
      const photo = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 1.2),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true })
      );
      
      const angle = (i / 4) * Math.PI * 2;
      const radius = i < 4? 3.5 : 5;
      const group = i < 4? ring1 : ring2;
      
      photo.position.x = Math.cos(angle) * radius;
      photo.position.z = Math.sin(angle) * radius;
      photo.lookAt(0, 0, 0);
      
      group.add(photo);
    });
    
    // Musik
    const audio = new Audio('./lagu_kalian.mp3');
    audio.loop = true;
    document.body.addEventListener('click', () => audio.play());
    
    // Animasi
    function animate() {
      requestAnimationFrame(animate);
      mainSphere.rotation.y += 0.002;
      ring1.rotation.y += 0.005;
      ring2.rotation.y -= 0.003;
      starField.rotation.y += 0.0002;
      controls.update();
      renderer.render(scene, camera);
      loadingDiv.style.display = 'none';
    }
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    animate();
  </script>
</body>
</html>
