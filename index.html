<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>You Are My Universe 🌌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000000;
            font-family: 'Georgia', serif;
            touch-action: none;
        }
        canvas { display: block; }
        #ui {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #judul {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 28px;
            text-shadow: 0 0 25px #ffffff, 0 0 40px #88ccff;
            animation: glow 2s ease-in-out infinite alternate;
        }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            font-family: Arial;
            text-shadow: 0 0 10px #000;
            opacity: 0.8;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
            z-index: 200;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #ffffff, 0 0 30px #88ccff; }
            to { text-shadow: 0 0 30px #ffffff, 0 0 50px #88ccff; }
        }
    </style>
    
    <!-- INI YANG BIKIN JALAN DI SEMUA HP -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Loading Universe... 🌌</div>
    <div id="ui">
        <div id="judul">You Are My Universe 🌌</div>
        <div id="info">Sentuh untuk musik | Pinch 2 jari untuk zoom | Geser untuk putar</div>
    </div>
    
    <audio id="bgm" loop>
        <source src="lagu_kalian.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // HILANGIN LOADING KALO UDAH JALAN
        document.getElementById('loading').style.display = 'none';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00025);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // LIMIT BIAR GA LAG
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 2.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.5;
        controls.minDistance = 2.5;
        controls.maxDistance = 40;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.2;
        camera.position.set(0, 2, 12);

        // CAHAYA
        scene.add(new THREE.AmbientLight(0x404040, 2));
        const hemiLight = new THREE.HemisphereLight(0x4477ff, 0x002244, 1.5);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // BACKGROUND GALAKSI - PAKE URL YANG ANTI-BLOKIR
        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = 'anonymous';
        const galaxyTexture = textureLoader.load('https://cdn.eso.org/images/large/eso1907a.jpg');
        const galaxyGeometry = new THREE.SphereGeometry(800, 64, 64);
        const galaxyMaterial = new THREE.MeshBasicMaterial({
            map: galaxyTexture,
            side: THREE.BackSide
        });
        const galaxySphere = new THREE.Mesh(galaxyGeometry, galaxyMaterial);
        scene.add(galaxySphere);

        // BINTANG
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 600;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({
            size: 0.2, color: 0xffffff, transparent: true, opacity: 0.9
        }));
        scene.add(stars);

        // BULAN
        const moonGeometry = new THREE.SphereGeometry(1.8, 64, 64);
        const moonTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_1024.jpg');
        
        const moonMaterial = new THREE.MeshStandardMaterial({ 
            map: moonTexture,
            bumpMap: moonTexture,
            bumpScale: 0.1,
            emissive: 0x6677aa,
            emissiveIntensity: 1.5,
            metalness: 0.1,
            roughness: 0.8
        });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        scene.add(moon);

        const glow1 = new THREE.PointLight(0xaaaaff, 6, 50);
        const glow2 = new THREE.PointLight(0x8888ff, 4, 30);
        moon.add(glow1, glow2);

        // FOTO
        const images = [
            'Screenshot_20260413-222119.jpg',
            'Screenshot_20260415-112014.jpg',
            'Screenshot_20260416-045337.jpg',
            'Screenshot_20260416-052453.jpg',
            'Screenshot_20260416-052457.jpg',
            'Screenshot_20260418-075359.jpg',
            'Screenshot_20260418-075421.jpg',
            'Screenshot_20260418-075429.jpg'
        ];

        const photoGroup = new THREE.Group();
        scene.add(photoGroup);
        const radius = 5;

        images.forEach((img, i) => {
            const texture = textureLoader.load(img);
            texture.colorSpace = THREE.SRGBColorSpace;
            
            const material = new THREE.MeshStandardMaterial({
                map: texture,
                side: THREE.DoubleSide,
                emissive: 0x222244,
                emissiveIntensity: 0.5
            });
            
            const geometry = new THREE.PlaneGeometry(2, 2);
            const plane = new THREE.Mesh(geometry, material);
            
            const angle = (i / images.length) * Math.PI * 2;
            const spiralY = Math.sin(i * 0.8) * 1.5;
            plane.position.x = Math.cos(angle) * radius;
            plane.position.z = Math.sin(angle) * radius;
            plane.position.y = spiralY;
            plane.lookAt(0, 0, 0);
            photoGroup.add(plane);
        });

        // MUSIK
        const bgm = document.getElementById('bgm');
        const info = document.getElementById('info');
        let musicStarted = false;
        
        document.body.addEventListener('pointerdown', () => {
            if (!musicStarted) {
                bgm.play().catch(e => console.log('Musik diblokir browser'));
                musicStarted = true;
                info.style.opacity = '0.3';
            }
        });

        // ANIMASI
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            
            galaxySphere.rotation.y = elapsed * 0.01;
            moon.rotation.y = elapsed * 0.1;
            photoGroup.rotation.y = elapsed * 0.15;
            stars.rotation.y = elapsed * 0.02;
            
            photoGroup.children.forEach((photo, i) => {
                photo.position.y = Math.sin(elapsed * 0.5 + i) * 0.3;
                photo.lookAt(0, 0, 0);
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
